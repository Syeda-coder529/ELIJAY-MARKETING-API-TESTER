<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RTB API Tester</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    background: radial-gradient(circle at 20% 20%, #1e1b4b 0%, #0f0f1a 45%, #050507 100%);
    min-height: 100vh;
  }
  .glass {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .glass-input {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .glass-input:focus {
    border-color: rgba(129,140,248,0.6);
    box-shadow: 0 0 0 3px rgba(129,140,248,0.15);
  }
  pre::-webkit-scrollbar { height: 8px; width: 8px; }
  pre::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 8px; }
</style>
</head>
<body class="text-slate-100 antialiased">

  <div class="min-h-screen flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-xl glass rounded-3xl shadow-2xl p-6 sm:p-8">

      <!-- Header -->
      <div class="mb-6 sm:mb-8">
        <h1 class="text-2xl sm:text-3xl font-bold bg-gradient-to-r from-indigo-300 via-violet-300 to-fuchsia-300 bg-clip-text text-transparent">
          RTB API Tester
        </h1>
        <p class="text-slate-400 text-sm mt-1">Send test pings to Ringba, Retreaver &amp; CallGrid</p>
      </div>

      <!-- Form -->
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5">CRM Provider</label>
          <select id="crmSelect"
            class="glass-input w-full rounded-xl px-4 py-2.5 text-sm text-slate-100 outline-none transition">
            <option value="ringba" class="bg-slate-900">Ringba</option>
            <option value="retreaver" class="bg-slate-900">Retreaver</option>
            <option value="callgrid" class="bg-slate-900">CallGrid</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5">API Key</label>
          <input id="apiKey" type="text" placeholder="Enter your API key"
            class="glass-input w-full rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 outline-none transition" />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1.5">Phone Number</label>
            <input id="phone" type="text" placeholder="+1 555 123 4567"
              class="glass-input w-full rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 outline-none transition" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1.5">Zip Code</label>
            <input id="zip" type="text" placeholder="90210"
              class="glass-input w-full rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 outline-none transition" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1.5">State</label>
            <input id="state" type="text" placeholder="CA"
              class="glass-input w-full rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 outline-none transition" />
          </div>
        </div>

        <button id="testBtn" onclick="testAPI()"
          class="w-full mt-2 rounded-xl px-4 py-3 text-sm font-semibold text-white bg-gradient-to-r from-indigo-500 to-fuchsia-500 hover:from-indigo-400 hover:to-fuchsia-400 active:scale-[0.98] transition shadow-lg shadow-indigo-900/30">
          Test API
        </button>
      </div>

      <!-- Response -->
      <div id="responseWrap" class="mt-6 hidden">
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center gap-2">
            <span class="text-xs font-medium text-slate-400">Response</span>
            <span id="statusBadge" class="text-[11px] font-bold px-2.5 py-1 rounded-full"></span>
          </div>
          <button onclick="copyResponse()"
            class="text-xs font-medium px-3 py-1.5 rounded-lg glass-input hover:bg-white/10 transition">
            Copy Response
          </button>
        </div>
        <pre id="response" class="glass-input rounded-xl p-4 text-xs sm:text-sm text-slate-200 overflow-x-auto max-h-80 whitespace-pre-wrap break-words"></pre>
      </div>

      <p id="copyToast" class="hidden text-xs text-emerald-400 mt-2 text-right">Copied to clipboard ✓</p>

    </div>
  </div>

<script>
  async function testAPI() {
    const crm = document.getElementById('crmSelect').value;
    const apiKey = document.getElementById('apiKey').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const zip = document.getElementById('zip').value.trim();
    const state = document.getElementById('state').value.trim();

    const btn = document.getElementById('testBtn');
    const wrap = document.getElementById('responseWrap');
    const badge = document.getElementById('statusBadge');
    const resEl = document.getElementById('response');

    if (!apiKey) {
      alert('Please enter an API Key');
      return;
    }

    wrap.classList.remove('hidden');
    btn.disabled = true;
    btn.textContent = 'Testing...';
    badge.textContent = 'PENDING';
    badge.className = 'text-[11px] font-bold px-2.5 py-1 rounded-full bg-yellow-500/20 text-yellow-300';
    resEl.textContent = 'Sending request...';

    try {
      const res = await fetch('/api/ping', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ crm, apiKey, phone, zip, state })
      });

      const data = await res.json();
      const success = data.ok && data.statusCode >= 200 && data.statusCode < 300;

      badge.textContent = success ? 'SUCCESS' : 'FAILED';
      badge.className = 'text-[11px] font-bold px-2.5 py-1 rounded-full ' +
        (success ? 'bg-emerald-500/20 text-emerald-300' : 'bg-red-500/20 text-red-300');

      resEl.textContent = JSON.stringify(data, null, 2);
    } catch (err) {
      badge.textContent = 'FAILED';
      badge.className = 'text-[11px] font-bold px-2.5 py-1 rounded-full bg-red-500/20 text-red-300';
      resEl.textContent = JSON.stringify({
        error: err.message,
        note: 'Could not reach /api/ping. Host this on a server (e.g. Vercel) if CORS error.'
      }, null, 2);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Test API';
    }
  }

  function copyResponse() {
    const text = document.getElementById('response').textContent;
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
      const toast = document.getElementById('copyToast');
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 1500);
    });
  }
</script>
</body>
</html>
